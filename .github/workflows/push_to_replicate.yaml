name: Push to Replicate

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Replicate model (owner/model-name)"
        required: true
        default: "peachspace/peach-comfy-anime"

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Cog
        run: |
          sudo curl -o /usr/local/bin/cog -L https://github.com/replicate/cog/releases/latest/download/cog_$(uname -s)_$(uname -m)
          sudo chmod +x /usr/local/bin/cog

      - name: Cog login
        run: |
          echo "${{ secrets.COG_TOKEN }}" | cog login --token-stdin

      - name: Install cog-safe-push
        run: |
          pip install git+https://github.com/replicate/cog-safe-push.git

      - name: Push to Replicate (safe)
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          cog-safe-push ${{ inputs.model }}
